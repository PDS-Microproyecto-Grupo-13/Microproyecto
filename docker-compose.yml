services:
  # ============================================================================
  # 1. MLflow Tracking Server & Model Registry
  # ============================================================================
  mlflow-tracking:
    build:
      context: ./model_provider/tracking
      dockerfile: Dockerfile
    container_name: mlops-tracking
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_HOST=0.0.0.0
      - MLFLOW_PORT=5000
      - MLFLOW_BACKEND_STORE_URI=sqlite:////var/lib/mlflow/db/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/var/lib/mlflow/artifacts
      - MLFLOW_SERVE_ARTIFACTS=true
      - MLFLOW_ALLOWED_HOSTS=localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow-tracking,mlflow-tracking:*
    volumes:
      - mlflow-db-data:/var/lib/mlflow/db
      - mlflow-artifact-data:/var/lib/mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mlops-net

  # ============================================================================
  # 2. MLflow Model Serving (Inference)
  # ============================================================================
  inference:
    build:
      context: ./model_provider/inference
      dockerfile: Dockerfile
    container_name: mlops-inference
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-tracking:5000
      - MODEL_NAME=salary_predict_model
      - MODEL_ALIAS=champion
      - INFERENCE_HOST=0.0.0.0
      - INFERENCE_PORT=5001
    volumes:
      - mlflow-artifact-data:/var/lib/mlflow/artifacts:ro
    depends_on:
      mlflow-tracking:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mlops-net

  # ============================================================================
  # 3. FastAPI Application Backend
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=mlops-backend
      - APP_VERSION=0.1.0
      - ENVIRONMENT=development
      - API_PREFIX=/api/v1
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
      - INFERENCE_BASE_URL=http://inference:5001
      - INFERENCE_TIMEOUT_SECONDS=10.0
      - MODEL_NAME=salary_predict_model
      - MODEL_ALIAS=champion
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mlops-net

  # ============================================================================
  # 4. React Frontend Dashboard
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mlops-net

# ==============================================================================
# Persistent Volumes (SQLite metadata store & Model artifacts)
# ==============================================================================
volumes:
  mlflow-db-data:
    name: mlops-mlflow-db-data
  mlflow-artifact-data:
    name: mlops-mlflow-artifact-data

# ==============================================================================
# Internal Bridge Network
# ==============================================================================
networks:
  mlops-net:
    name: mlops-network
    driver: bridge
