data:
  input_dir: data/raw/foorilla
  file_pattern: jobs_*.csv
  experiment: reported
  train_fraction: 0.70
  validation_fraction: 0.15
  outlier_iqr_multiplier: 3.0
  minimum_segment_size: 100

features:
  include_company: true
  target_strategy: minimum_width_log

model:
  loss_function: MAE
  eval_metric: MAE
  iterations: 500
  learning_rate: 0.05
  depth: 8
  l2_leaf_reg: 5.0
  random_strength: 1.0
  random_seed: 42
  thread_count: -1
  early_stopping_rounds: 50
  allow_writing_files: false
  verbose: 50

tracking:
  enabled: true
  tracking_uri: sqlite:///ml/catboost_baseline/.mlflow/mlflow.db
  experiment_name: salary-catboost-baseline

artifacts:
  output_dir: ml/catboost_baseline/artifacts
