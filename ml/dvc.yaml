stages:
  collect:
    cmd: python -m ml_pipeline collect
    deps:
      - data/raw/foorilla
      - src/ml_pipeline/data/collect.py
    outs:
      - data/interim/foorilla_consolidated.parquet
      - artifacts/reports/data_manifest.json:
          cache: false

  validate:
    cmd: python -m ml_pipeline validate
    deps:
      - data/interim/foorilla_consolidated.parquet
      - src/ml_pipeline/data/validate.py
    outs:
      - data/validated/dataset.parquet
      - artifacts/reports/validation.json:
          cache: false

  preprocess:
    cmd: python -m ml_pipeline preprocess
    deps:
      - data/validated/dataset.parquet
      - src/ml_pipeline/data/preprocess.py
      - src/ml_pipeline/features.py
    params:
      - data
    outs:
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/test.parquet
      - artifacts/reports/train_limits.json:
          cache: false
      - artifacts/reports/preprocess.json:
          cache: false

  qualify:
    cmd: python -m ml_pipeline qualify
    deps:
      - artifacts/reports/train_limits.json
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - src/ml_pipeline/features.py
      - src/ml_pipeline/modeling/qualify.py
    params:
      - model
      - qualification
    outs:
      - artifacts/reports/qualification.json:
          cache: false
      - artifacts/reports/uncertainty_calibration.json:
          cache: false

  train:
    cmd: python -m ml_pipeline train
    deps:
      - artifacts/reports/qualification.json
      - artifacts/reports/train_limits.json
      - artifacts/reports/uncertainty_calibration.json
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - src/ml_pipeline/features.py
      - src/ml_pipeline/modeling/qualify.py
      - src/ml_pipeline/modeling/train.py
    params:
      - model
    outs:
      - artifacts/reports/training.json:
          cache: false
      - artifacts/work/model/model.joblib

  evaluate:
    cmd: python -m ml_pipeline evaluate
    deps:
      - artifacts/reports/qualification.json
      - artifacts/reports/training.json
      - artifacts/work/model/model.joblib
      - data/processed/test.parquet
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - src/ml_pipeline/features.py
      - src/ml_pipeline/modeling/evaluate.py
      - src/ml_pipeline/modeling/qualify.py
      - src/ml_pipeline/modeling/train.py
    params:
      - evaluation
      - model
    outs:
      - artifacts/reports/audit_novelty.json:
          cache: false
      - artifacts/reports/audit_segments.json:
          cache: false
      - artifacts/reports/audit_sensitivity.json:
          cache: false
      - artifacts/reports/candidate.json:
          cache: false
      - artifacts/reports/experiment_manifest.json:
          cache: false
      - artifacts/reports/feature_importance.json:
          cache: false
      - artifacts/reports/metrics.json:
          cache: false

  analytics:
    cmd: python -m ml_pipeline analytics
    deps:
      - artifacts/reports/data_manifest.json
      - artifacts/reports/experiment_manifest.json
      - artifacts/reports/metrics.json
      - artifacts/reports/preprocess.json
      - artifacts/reports/validation.json
      - data/processed/test.parquet
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - src/ml_pipeline/analytics.py
      - src/ml_pipeline/analytics_schema.py
      - src/ml_pipeline/cli.py
      - src/ml_pipeline/common/io.py
      - src/ml_pipeline/common/logging.py
      - src/ml_pipeline/data/collect.py
      - src/ml_pipeline/features.py
      - src/ml_pipeline/settings.py
    params:
      - analytics
    outs:
      - artifacts/reports/dashboard_summary.json:
          cache: false

