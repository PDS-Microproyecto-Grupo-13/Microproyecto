data:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  target_scope: reportado

model:
  algorithm: logistic_regression
  random_state: 42

  logistic_regression:
    C: 1.0
    max_iter: 1000

  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_leaf: 1

evaluation:
  primary_metric: f1
  minimum_score: 0.80
